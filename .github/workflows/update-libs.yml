name: Update bundled libraries

# Weekly: pull each library in AdvanceRaidTools_Libraries/Libs from upstream
# (sources and pins in .github/libs.json), check the result, open a PR whose
# body lists every version change and upstream commit, then merge it.
#
# Main only accepts PRs that pass "Addon source checks", which never run on a
# PR opened with GITHUB_TOKEN, so this uses the LIBS_UPDATE_TOKEN secret: a
# fine-grained token for this repo with Contents and Pull requests read/write.
# The PR then runs CI, auto-merges once it passes, and the merge triggers
# release.yml. Needs "Allow auto-merge" on in the repo settings.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-libs

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: libs/auto-update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 subversion

      - name: Sync libraries from upstream
        id: sync
        run: python3 -I .github/scripts/update_libs.py --repo . --report "$RUNNER_TEMP/report.md"

      - name: Check Lua syntax
        if: steps.sync.outputs.changed == 'true'
        run: git ls-files -z '*.lua' | xargs -0 -r luac5.1 -p

      - name: Check packaging
        if: steps.sync.outputs.changed == 'true'
        uses: BigWigsMods/packager@20a3713ec537df54db5c0d8b4822d88ee63c70e8
        with:
          args: -d

      - name: Open and merge pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIBS_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::LIBS_UPDATE_TOKEN secret is not set; cannot open the library update PR."
            exit 1
          fi
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A AdvanceRaidTools_Libraries .github/libs.json
          { echo "Update bundled libraries"; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          title="Update bundled libraries ($(date -u +%Y-%m-%d))"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi

          # Merges once the required "Addon source checks" pass on the PR.
          gh pr merge "$BRANCH" --squash --delete-branch --auto
