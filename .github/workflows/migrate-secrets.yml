# One-time migration: output is sealed to GitHub's environment public key.
# The destination key is committed, so repository variables cannot redirect it.
name: Move publishing secrets into protected environment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Install distribution-provided sealed-box implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-nacl
      - name: Seal existing publishing credentials for the protected environment
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          BRICK_WORKFLOW_TOKEN: ${{ secrets.BRICK_WORKFLOW_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('nAYWy1RpD+YwACVEZPoVCU0WJJaRGf89fZLWNuTM1mE=')))
          values = {}
          for name in ['CF_API_KEY', 'WAGO_API_TOKEN', 'BRICK_WORKFLOW_TOKEN']:
              value = os.environ[name]
              if not value: raise RuntimeError('Missing credential: ' + name)
              values[name] = base64.b64encode(box.encrypt(value.encode())).decode()
          Path('sealed-secrets.json').write_text(json.dumps({'key_id': '3380204578043523366', 'values': values}))
          print('Credentials sealed to the protected GitHub environment; no plaintext exported.')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-publishing-secrets
          path: sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
