name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    name: Addon source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          git ls-files -z '*.lua' | xargs -0 -r luac5.1 -p
      - name: Verify addon packaging without upload credentials
        uses: BigWigsMods/packager@20a3713ec537df54db5c0d8b4822d88ee63c70e8
        with:
          args: -d
